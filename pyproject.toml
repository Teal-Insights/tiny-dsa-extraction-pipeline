[project]
name = "tiny-dsa-extraction-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "excel-grapher>=3.18.0",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "fastpyxl>=1.0.9",
    "pywin32>=311; sys_platform == 'win32'",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "quarto>=0.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.34",
    "xlwings>=0.35.3",
    "vl-convert-python>=1.9.0.post1",
    "matplotlib>=3.10.9",
    "great-docs>=0.12.0",
    "pygments>=2.20.0",
    "pandas>=3.0.3",
    "polars>=1.41.2",
]

[tool.pytest.ini_options]
addopts = "-v -p no:faulthandler -p no:cacheprovider"

[tool.ruff.format]
# Keep formatted Python on LF so Windows checkouts cannot reintroduce the CRLF
# bytes that `git diff --check` flags as trailing whitespace.
line-ending = "lf"
