[project]
name = "tiny-dsa-extraction-pipeline"
version = "0.1.0"
description = "Extract the Tiny DSA Excel workbook into a keyword-only inverted-tree Python library"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cursor-sdk>=1.0.31",
    "excel-grapher>=12.7.1",
    "openai>=2.38.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "fastpyxl>=1.1.0",
    "pywin32>=311; sys_platform == 'win32'",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.16.0",
    "ty>=0.0.34",
    "xlwings>=0.35.3",
]

[tool.pytest.ini_options]
addopts = "-v -p no:faulthandler -p no:cacheprovider"

[tool.ruff.lint]
# Ruff 0.16+ expanded defaults (413 rules): see
# https://docs.astral.sh/ruff/default-rules/
# Keep those defaults; do not blanket-ignore BLE001 / S102 / DTZ001 / B010.
# Intentional targeted `# noqa`s remain for:
# - BLE001: blind except around diagnostic I/O and differential sweep capture
# - S102: exec of generated / parity / test modules
# - DTZ001: naive Excel epoch datetime
# - B010: setattr marker on a patched function (ty rejects direct assignment)
# Prefer fixing the code over adding noqa when cheap (e.g. typed attribute
# access instead of getattr(..., "const")).

[tool.ruff.format]
# Keep formatted Python on LF so Windows checkouts cannot reintroduce the CRLF
# bytes that `git diff --check` flags as trailing whitespace.
line-ending = "lf"
# The synthetic guide is Markdown; Ruff 0.16 formats fenced code blocks by
# default. Keep it excluded if it grows fenced Python.
exclude = ["tests/fixtures/synthetic/guide.md"]
