schema_version: 1.13.0
workbook: workbook.xlsx
concept_scheme:
  id: shared_time_period_fixture
  concepts:
    - id: OBS_VALUE
      name: Observation value
      dtype: number
    - id: TIME_PERIOD
      name: Time period
      dtype: int
series:
  - id: dual_period_indicator
    sheet: Engine
    data_range: Engine!C10:D10
    layout: row_series
    internal: {}
    structure:
      measure:
        concept: OBS_VALUE
        dtype: float
        bind:
          kind: data_cell
          read: float
      dimensions:
        - id: PROJECTION_PERIOD
          concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: column_header
            header_row: 5
            read: int
        - id: REFERENCE_PERIOD
          concept: TIME_PERIOD
          role: key
          scope: cell
          bind:
            kind: value_map
            values:
              0: C:D
            read: int
    key: [PROJECTION_PERIOD, REFERENCE_PERIOD]
    notes: Two key dimensions share TIME_PERIOD with distinct ids.
